version: '3.8'

services:
  nexora-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nexora-platform
    restart: unless-stopped
    ports:
      - '5000:5000'
    environment:
      - NODE_ENV=production
      - PORT=5000
      - MONGODB_URI=${MONGODB_URI:-mongodb://mongodb:27017/nexora_erp}
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=${JWT_SECRET:-nexora_dev_jwt_secret_key_2026_super_secure_32_chars}
      - AI_PROVIDER=${AI_PROVIDER:-omniroute}
      - OMNIROUTE_API_KEY=${OMNIROUTE_API_KEY}
      - OMNIROUTE_BASE_URL=${OMNIROUTE_BASE_URL:-http://localhost:20128/v1}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - MOCK_ERP_ENABLED=true
    depends_on:
      - redis

  redis:
    image: redis:7-alpine
    container_name: nexora-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data

volumes:
  redis_data:
